version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - MODEL_XML=best_pneumonia_model_openvino.xml
      - PYTORCH_MODEL=best_pneumonia_model.pth

  web:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - API_HOST=http://api:8000
    depends_on:
      - api
